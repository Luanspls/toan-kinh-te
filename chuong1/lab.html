<!doctype html>
<html lang="vi" data-mode="hv" data-chapter="chuong1" data-portal="../index.html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng tính ma trận</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<link rel="stylesheet" href="../lib/katex/katex.min.css">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  html, body { height: auto; }
  body { overflow: auto; }
  .page { max-width: 1100px; margin: 0 auto; padding-block: 24px 48px; padding-inline: 16px; display: grid; gap: 20px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  .top h1 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 38px); margin: 0; }
  .top .k { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pen); }
  .top nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .lab { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .lab { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; font-size: 15px; }
  .panel label { font-weight: 600; font-size: 14px; }
  .panel textarea { width: 100%; min-height: 130px; font: 15px/1.5 var(--f-mono); padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); resize: vertical; }
  .panel select { font: inherit; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); width: 100%; }
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ops .btn { font-size: 14px; padding: 8px 6px; }
  .hint { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .result { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 18px; min-width: 0; display: grid; gap: 10px; font-size: 16px; }
  .result h2 { font-family: var(--f-display); margin: 0; font-size: 22px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: st; }
  .steps li { overflow-x: auto; padding: 4px 0 4px 34px; position: relative; border-bottom: 1px dashed var(--line); }
  .steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 12px; color: var(--pen); border: 1.5px solid var(--pen); border-radius: 999px; width: 22px; height: 22px; display: grid; place-items: center; }
  .final { border: 2px dashed var(--pen); border-radius: 8px; padding: 10px 14px; overflow-x: auto; }
  .err { color: var(--bad); font-weight: 600; }
  #matB-wrap[hidden] { display: none; }
</style>
<meta name="theme-color" content="#1b2a4a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
</head>
<body>
<div class="page">
  <header class="top">
    <div><div class="k">Toán kinh tế · Chương 1 · Công cụ tự kiểm tra</div><h1>Phòng tính ma trận</h1></div>
    <nav><a class="xref back" href="index.html">Trang chương</a><a class="xref back" href="buoi1.html">Buổi 1</a><a class="xref back" href="buoi2.html">Buổi 2</a><a class="xref back" href="buoi4.html">Buổi 4</a></nav>
  </header>

  <div class="lab">
    <form class="panel" id="f" autocomplete="off">
      <label for="ex">Nạp ví dụ từ bài giảng</label>
      <select id="ex">
        <option value="">— Chọn ví dụ —</option>
        <option value="rank|1 1 1 1\n1 2 3 4\n2 3 4 6">Hạng · Ví dụ 1.11 (Buổi 1)</option>
        <option value="rank|1 2 3 6\n2 -5 -12 -4\n-3 8 19 3">Hạng · BT 1.4d (Buổi 1)</option>
        <option value="det|1 1 3 4\n1 1 5 2\n2 1 3 2\n2 3 11 5">Định thức · Ví dụ 1.44 (Buổi 2)</option>
        <option value="det|-6 1 7\n5 -2 3\n-3 4 5">Định thức · BT 1.7b (Buổi 2)</option>
        <option value="inverse|0 1 1\n1 0 1\n1 1 0">Nghịch đảo · Ví dụ 1.12 (Buổi 2)</option>
        <option value="inverse|4 1 2\n3 -1 0\n3 5 5">Nghịch đảo · BT 1.5b (Buổi 3)</option>
        <option value="inverse|1 -1 6\n5 7 1\n-2 4 5">Nghịch đảo · BT 1.5c (Buổi 3)</option>
        <option value="solve|1 2 1 1\n2 5 1 6\n-1 -4 2 2">Giải hệ · Ví dụ 1.45a (Buổi 4)</option>
        <option value="solve|1 -4 2 7\n2 1 -1 -5\n3 -3 1 3">Giải hệ · BT 1.21b (Buổi 4)</option>
        <option value="solve|2 2 3 2 0\n1 -3 5 -4 3\n3 1 11 4 5\n1 -5 2 -10 1">Giải hệ · BT 1.21c (Buổi 4)</option>
        <option value="solve|3 0 -3 3 0\n1 -1 1 2 0\n2 1 -4 1 0\n1 2 -5 -1 0">Hệ thuần nhất · Ví dụ 1.48 (Buổi 4)</option>
        <option value="mul|20 15 10\n25 12 8|150 130\n200 180\n60 50">Nhân ma trận · Doanh thu (Buổi 1)</option>
      </select>
      <label for="matA">Ma trận A <span class="hint">(mỗi dòng một hàng; số cách nhau bởi dấu cách; nhận phân số 1/2 và số thập phân 0.5)</span></label>
      <textarea id="matA" spellcheck="false">1 1 1 1
1 2 3 4
2 3 4 6</textarea>
      <div id="matB-wrap" hidden>
        <label for="matB">Ma trận B (cho phép nhân A·B)</label>
        <textarea id="matB" spellcheck="false"></textarea>
      </div>
      <div class="ops">
        <button class="btn" type="button" data-op="det">Định thức</button>
        <button class="btn" type="button" data-op="rank">Hạng</button>
        <button class="btn" type="button" data-op="inverse">Nghịch đảo</button>
        <button class="btn" type="button" data-op="rref">Bậc thang rút gọn</button>
        <button class="btn" type="button" data-op="solve">Giải hệ (cột cuối = vế phải)</button>
        <button class="btn" type="button" data-op="mul">Nhân A · B</button>
      </div>
      <p class="hint">Kết quả hiển thị đầy đủ từng phép biến đổi sơ cấp, dùng để đối chiếu lời giải tay. Mọi phép tính dùng phân số chính xác.</p>
    </form>

    <section class="result" aria-live="polite">
      <h2 id="rt">Kết quả</h2>
      <div id="out"></div>
    </section>
  </div>
</div>
<script src="../lib/katex/katex.min.js"></script>
<script src="../lib/katex/auto-render.min.js"></script>
<script src="../assets/linalg.js"></script>
<script src="../assets/widgets.js"></script>
<script src="../assets/deck.js"></script>
<script>
(function () {
  const K = TKTWidgets.K, out = document.getElementById('out'), rt = document.getElementById('rt');
  const A = document.getElementById('matA'), B = document.getElementById('matB'), bw = document.getElementById('matB-wrap');
  const names = { det: 'Định thức', rank: 'Hạng', inverse: 'Ma trận nghịch đảo', rref: 'Bậc thang rút gọn', solve: 'Giải hệ phương trình', mul: 'Tích A · B' };
  function stepsHtml(steps, opts, det) {
    return '<ol class="steps">' + steps.slice(1).map((s, k) => {
      const prev = steps[k];
      const ops = '\\substack{' + s.ops.join(' \\\\ ') + '}';
      const swap = s.ops.length === 1 && s.ops[0].includes('leftrightarrow');
      const mid = det ? '\\;\\overset{' + ops + '}{=}\\;' + (swap ? '-' : '') : '\\xrightarrow{' + ops + '}';
      return '<li>' + K(LA.texMatrix(prev.M, opts) + mid + LA.texMatrix(s.M, Object.assign({ hlRows: s.hl || [] }, opts)), true) + '</li>';
    }).join('') + '</ol>';
  }
  function run(op) {
    rt.textContent = names[op];
    try {
      const M = LA.parseMatrix(A.value);
      let html = '';
      if (op === 'mul') {
        bw.hidden = false;
        const N = LA.parseMatrix(B.value || '0');
        const P = LA.mul(M, N);
        html = '<div class="final">' + K('A\\cdot B=' + LA.texMatrix(M) + LA.texMatrix(N) + '=' + LA.texMatrix(P), true) + '</div><p class="hint">Cấp: (' + M.length + '×' + M[0].length + ')·(' + N.length + '×' + N[0].length + ') = ' + P.length + '×' + P[0].length + '</p>';
      } else if (op === 'det') {
        const r = LA.eliminate(M, { mode: 'det' }); if (M.length !== M[0].length) throw new Error('Định thức chỉ xác định cho ma trận vuông (ma trận đang có ' + M.length + ' dòng, ' + M[0].length + ' cột).');
        html = K('\\det A=' + LA.texMatrix(M, { det: true }), true) + stepsHtml(r.steps, { det: true }, true) +
          '<div class="final">' + (r.rank < M.length ? 'Có dòng bằng 0 ⇒ ' + K('\\det A=0') : K('\\det A=' + (r.sign < 0 ? '-' : '') + r.M.map((row, i) => '(' + row[i].tex() + ')').join('') + '=' + r.det.tex())) + '</div>';
      } else if (op === 'rank') {
        const r = LA.eliminate(M, { mode: 'rank' });
        html = stepsHtml(r.steps, {}) + '<div class="final">Dạng bậc thang có ' + r.rank + ' dòng khác 0 ⇒ ' + K('r(A)=' + r.rank) + '</div>';
        if (r.steps.length === 1) html = K(LA.texMatrix(M), true) + html;
      } else if (op === 'inverse') {
        if (M.length !== M[0].length) throw new Error('Chỉ ma trận vuông mới xét ma trận nghịch đảo.');
        const r = LA.inverse(M), n = M.length;
        html = stepsHtml(r.steps, { aug: n }) + '<div class="final">' + (r.inv ? K('A^{-1}=' + LA.texMatrix(r.inv), true) : 'Vế trái có dòng 0 ⇒ ' + K('\\det A=0') + ', A <b>không khả nghịch</b>.') + '</div>';
      } else if (op === 'rref') {
        const r = LA.eliminate(M, { mode: 'rref' });
        html = stepsHtml(r.steps, {}) + '<div class="final">' + K(LA.texMatrix(r.M), true) + '</div>';
      } else if (op === 'solve') {
        if (M[0].length < 2) throw new Error('Cần ít nhất 2 cột: các cột hệ số và cột vế phải.');
        const r = LA.solve(M); const vars = Array.from({ length: r.n }, (_, j) => 'x_{' + (j + 1) + '}');
        let fin = K('r(A)=' + r.rankA + ',\\ r(\\overline{A})=' + r.rankAb + ',\\ n=' + r.n) + '<br>';
        if (r.kind === 'none') fin += '<b>Hệ vô nghiệm.</b>';
        else if (r.kind === 'unique') fin += '<b>Nghiệm duy nhất:</b> ' + K('(' + vars.join(',') + ')=(' + r.tex.join(';\\ ') + ')');
        else fin += '<b>Vô số nghiệm</b> (' + (r.n - r.rankA) + ' ẩn tự do): ' + K('(' + r.tex.join(';\\ ') + ')');
        html = stepsHtml(r.steps, { aug: 1 }) + '<div class="final">' + fin + '</div>';
      }
      out.innerHTML = html;
    } catch (e) { out.innerHTML = '<p class="err">' + e.message + '</p><p class="hint">Kiểm tra lại: mỗi dòng cùng số phần tử, chỉ dùng số, dấu cách, dấu "/" và dấu chấm thập phân.</p>'; }
  }
  document.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => run(b.dataset.op)));
  document.getElementById('ex').addEventListener('change', e => {
    const v = e.target.value; if (!v) return;
    const [op, a, b] = v.split('|');
    A.value = a.replace(/\\n/g, '\n'); if (b) { B.value = b.replace(/\\n/g, '\n'); }
    bw.hidden = op !== 'mul';
    run(op);
  });
  document.getElementById('f').addEventListener('submit', e => e.preventDefault());
  run('rank');
})();
</script>
<script src="../assets/pwa.js"></script>
</body>
</html>
